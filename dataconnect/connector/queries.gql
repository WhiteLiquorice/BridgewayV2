# Phase 1 Migration Queries and Mutations

query GetOrgClients($orgId: UUID!) @auth(level: USER) {
  clients(where: { orgId: { eq: $orgId } }, orderBy: [{ name: ASC }]) {
    id
    name
    email
    phone
    createdAt
    appointments_on_client(orderBy: [{ scheduledAt: DESC }]) {
      id
      scheduledAt
      amount
      status
    }
  }
}

query GetClientDetail($id: UUID!) @auth(level: USER) {
  client(id: $id) {
    id
    name
    email
    phone
    dateOfBirth
    address
    notes
    createdAt
    appointments_on_client(orderBy: [{ scheduledAt: DESC }]) {
      id
      scheduledAt
      durationMinutes
      status
      amount
      notes
      service {
        name
      }
    }
    clientPackages_on_client {
      id
      name
      totalSessions
      usedSessions
      price
      purchasedAt
      expiresAt
      status
    }
    classRegistrations_on_client {
      id
      classDate
      status
      classEntity {
        name
        startTime
        durationMinutes
      }
    }
  }
}

