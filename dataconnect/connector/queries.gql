# Dashboard Stats Query
query GetAdminDashboardStats($orgId: UUID!, $thirtyDaysAgo: Timestamp!, $sevenDaysAgo: Timestamp!, $todayStart: Timestamp!, $todayEnd: Timestamp!) @auth(level: USER) {
  # Users count (fetch IDs to count client-side)
  profiles(where: { orgId: { eq: $orgId } }) { id }
  
  # Clients count
  clients(where: { orgId: { eq: $orgId } }) { id }
  
  # Appointments count
  appointments(where: { orgId: { eq: $orgId } }) { id }
  
  # Services count
  services(where: { orgId: { eq: $orgId } }) { id }
  
  # Recent Activity
  activityLogs(where: { orgId: { eq: $orgId } }, orderBy: [{ createdAt: DESC }], limit: 5) {
    id
    action
    createdAt
    userId
  }
  
  # Recent Clients
  recentClients: clients(where: { orgId: { eq: $orgId }, createdAt: { ge: $thirtyDaysAgo } }) { id }
  
  # Recent Appointments (30 days)
  recentAppts: appointments(where: { orgId: { eq: $orgId }, createdAt: { ge: $thirtyDaysAgo } }) {
    id
    status
    amount
    createdAt
    cancellationReason
  }
  
  # Week Appointments
  weekAppts: appointments(where: { orgId: { eq: $orgId }, scheduledAt: { ge: $sevenDaysAgo } }) {
    id
    amount
    scheduledAt
  }
  
  # Today Appointments
  todayAppts: appointments(where: { orgId: { eq: $orgId }, scheduledAt: { ge: $todayStart, le: $todayEnd } }) {
    id
    amount
    status
  }
}

# Booking App Data Queries
query GetBookingPageData($slug: String!) @auth(level: PUBLIC) {
  orgs(where: { slug: { eq: $slug }, subscriptionTier: { eq: "base" } }) {
    id
    name
    logoUrl
    primaryColor
    secondaryColor
    layoutTheme
    appTheme
    stripePublishableKey
    services_on_org(where: { isArchived: { eq: false } }, orderBy: [{ name: ASC }]) {
      id
      name
      description
      durationMinutes
      price
    }
    orgSetting_on_org {
      paymentRequired
      externalCalendarSyncEnabled
      stripeAccountId
      bookingConfig
      allowPhotoUpload
    }
  }
}

query GetAppointmentsForDay($orgId: UUID!, $startOfDay: Timestamp!, $endOfDay: Timestamp!) @auth(level: USER) {
  appointments(
    where: { 
      orgId: { eq: $orgId }, 
      status: { in: ["confirmed", "pending", "arrived", "with_provider"] }, 
      scheduledAt: { ge: $startOfDay, le: $endOfDay } 
    }
  ) {
    scheduledAt
    service {
      durationMinutes
    }
  }
}

query GetBookingById($id: UUID!) @auth(level: USER) {
