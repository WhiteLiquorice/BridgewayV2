      status: { in: ["confirmed", "arrived", "with_provider"] },
      scheduledAt: { ge: $todayStart, le: $todayEnd }
    },
    orderBy: [{ scheduledAt: ASC }]
  ) {
    id
    scheduledAt
    status
    client {
      id
      name
    }
    service {
      id
      name
    }
    staff {
      id
      fullName
    }
  }
}

