<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stanley Browser Butler</title>
  <style>
    :root {
      --bg-dark: #030712;
      --bg-card: #0b0f19;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --brand: #22c55e;
      --brand-hover: #16a34a;
      --brand-glow: rgba(34, 197, 94, 0.2);
      --accent: #22d3ee;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      background-color: var(--bg-dark);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text-main);
      padding: 16px;
      overflow-hidden: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-b: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #ffffff, #d1d5db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }

    .badge.connected .badge-dot {
      background-color: var(--brand);
      box-shadow: 0 0 8px var(--brand);
    }

    .badge.connected {
      color: var(--brand);
      background-color: rgba(34, 197, 94, 0.08);
      border-color: rgba(34, 197, 94, 0.2);
    }

    .badge.disconnected .badge-dot {
      background-color: var(--error);
      box-shadow: 0 0 8px var(--error);
    }

    .badge.disconnected {
      color: var(--error);
      background-color: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      height: 85px;
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: all 0.2s;
    }

    textarea:focus {
      border-color: rgba(34, 197, 94, 0.5);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.15);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, var(--brand), #10b981);
      color: #030712;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px var(--brand-glow);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      background: #374151;
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .status-panel {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 48px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-log {
      font-family: monospace;
      color: var(--accent);
      white-space: pre-wrap;
      word-break: break-all;
    }
    
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .example-tag {
      font-size: 10px;
      background-color: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .example-tag:hover {
      background-color: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.3);
      color: var(--brand);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-container">
      <img src="icon.png" alt="Stanley Logo" class="logo">
      <span class="title">STANLEY</span>
    </div>
    <div id="connection-badge" class="badge disconnected">
      <span class="badge-dot"></span>
      <span id="badge-text">Offline</span>
    </div>
  </div>

  <!-- Prompt Box Card -->
  <div class="card">
    <label class="label" for="task-input">What task should Stanley do today?</label>
    <textarea id="task-input" placeholder="e.g. Navigate to google.com, type 'Project Stanley' into the search input, then click search"></textarea>
    
    <div class="examples">
      <span class="example-tag" data-text="navigate to https://news.ycombinator.com, scrape stories">HN Scraper</span>
      <span class="example-tag" data-text="navigate to https://github.com, search for 'playwright'">Search GitHub</span>
      <span class="example-tag" data-text="navigate to https://google.com, type 'Project Stanley' and submit">Google Search</span>
    </div>
  </div>

  <!-- Run Button -->
  <button id="run-btn" class="btn" disabled>
    <span>Run Workflow</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="5 3 19 12 5 21 5 3"></polygon>
    </svg>
  </button>

  <!-- Status Log -->
  <div class="card" style="margin-top: 16px; margin-bottom: 0;">
    <span class="label">Activity Feed</span>
    <div class="status-panel">
      <div id="status-desc">Ready to launch daemon wrapper.</div>
      <div id="status-log" class="status-log">Idle</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
